# Render Blueprint for the RepoRevive backend.
#
# Render reads a Blueprint named `render.yaml` at the REPOSITORY ROOT. In this
# monorepo, either move this file to the repo root and keep `rootDir: backend`,
# or deploy the service manually pointing at the `backend/` directory.
services:
  - type: web
    name: reporevive-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Set to the deployed frontend origin(s), comma-separated.
      - key: FRONTEND_ORIGIN
        sync: false
      # Server-side secret; leave unset to run deterministic-only.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # Optional, public repos only.
      - key: GITHUB_TOKEN
        sync: false
