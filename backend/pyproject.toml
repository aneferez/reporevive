[project]
name = "reporevive-backend"
version = "0.1.0"
description = "RepoRevive backend — AI-assisted repository analysis and recovery."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
