# Render Blueprint for RepoRevive (backend web service + frontend static site).
#
# Render reads a Blueprint named `render.yaml` at the REPOSITORY ROOT (here).
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo.
#
# Two services deploy together. Because the browser talks to the backend over
# its PUBLIC URL (fromService only exposes private hostnames), the two
# cross-referencing values are set by hand after the first deploy, then redeploy:
#   * backend  FRONTEND_ORIGIN   = the frontend's public URL (CORS allowlist)
#   * frontend VITE_API_BASE_URL = the backend's public URL (baked in at build)
# See DEPLOY.md for the full step-by-step.
services:
  - type: web
    name: reporevive-backend
    runtime: python
    rootDir: backend
    plan: free
    # Install AI deps too so Gemini chat/narration/embeddings work in production.
    # For a lean, deterministic-only deploy, drop `-r requirements-ai.txt`.
    buildCommand: pip install -r requirements.txt -r requirements-ai.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.6"
      # Render terminates TLS at one proxy in front of the app.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Require the per-analysis owner token once the frontend is deployed with
      # owner-token header support.
      - key: REQUIRE_OWNER_TOKEN
        value: "true"
      # Set to the deployed frontend origin(s), comma-separated (CORS allowlist).
      - key: FRONTEND_ORIGIN
        sync: false
      # Server-side secret. Leave unset to run deterministic-only (no AI).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      # lexical (default, no quota) | embeddings (semantic, uses AI quota) | pgvector
      - key: RETRIEVAL_MODE
        value: lexical
      # Optional, public repos only; raises GitHub's anonymous rate limit.
      - key: GITHUB_TOKEN
        sync: false

  # Frontend: static Vite build served by Render. Paths are relative to rootDir.
  - type: web
    name: reporevive-frontend
    runtime: static
    rootDir: frontend
    # --include=dev forces devDependencies (tsc/vite) even if NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    # Single-origin setup: proxy API traffic to the backend so the whole app is
    # served from ONE URL (no CORS). Order matters — specific proxies first, the
    # SPA fallback last. The backend's public URL is hardcoded here; update it if
    # the backend is recreated with a different name/suffix.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://reporevive-backend-6twt.onrender.com/api/*
      - type: rewrite
        source: /health
        destination: https://reporevive-backend-6twt.onrender.com/health
      - type: rewrite
        source: /docs
        destination: https://reporevive-backend-6twt.onrender.com/docs
      - type: rewrite
        source: /openapi.json
        destination: https://reporevive-backend-6twt.onrender.com/openapi.json
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Same-origin: point this at the FRONTEND's OWN public URL so the app calls
      # /api on this origin, which the routes above proxy to the backend. Baked in
      # at build time — redeploy this site after changing it.
      - key: VITE_API_BASE_URL
        sync: false
